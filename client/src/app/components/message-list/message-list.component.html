<div class="flex flex-col gap-2 p-4 md:p-6">
  @for (msg of messages(); track trackByMessageId($index, msg)) {
    <app-message-item
      [message]="msg"
      [isLast]="isLastAIMessage($index)"
      (feedbackGiven)="onFeedback($event, msg._id)"
    />
  }

  @if (loading()) {
    <div class="flex justify-start mb-4">
      <div class="flex gap-3 items-center">
        <div class="w-8 h-8 rounded-full shrink-0 bg-blue-600 flex items-center justify-center text-white text-xs font-bold">
          AI
        </div>
        <div class="bg-gray-100 rounded-lg px-4 py-3">
          <div class="flex gap-1 items-center">
            <span class="w-2 h-2 rounded-full bg-gray-400 animate-bounce [animation-delay:0ms]"></span>
            <span class="w-2 h-2 rounded-full bg-gray-400 animate-bounce [animation-delay:150ms]"></span>
            <span class="w-2 h-2 rounded-full bg-gray-400 animate-bounce [animation-delay:300ms]"></span>
          </div>
        </div>
      </div>
    </div>
  }
</div>
