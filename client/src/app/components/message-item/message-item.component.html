<div [class]="message().role === 'user' ? 'flex justify-end' : 'flex justify-start'" class="mb-4">
  <div [class]="message().role === 'user' ? 'max-w-xs lg:max-w-md' : 'max-w-2xl lg:max-w-3xl'">
    @if (message().role === 'assistant') {
      <div>
        <div class="flex gap-3">
          <div
            class="w-8 h-8 rounded-full shrink-0 bg-blue-600 flex items-center justify-center text-white text-xs font-bold"
          >
            AI
          </div>
          <div
            class="bg-gray-100 rounded-lg px-4 py-3 prose prose-sm max-w-none prose-headings:font-semibold prose-headings:text-gray-900 prose-p:text-gray-900 prose-li:text-gray-900 prose-strong:text-gray-900 [&>*:first-child]:mt-0! [&>*:last-child]:mb-0!"
          >
            <div [innerHTML]="renderedContent()"></div>
          </div>
        </div>

        @if (isLast()) {
          <div class="flex gap-2 mt-2 ml-11">
            <!-- Thumbs Up -->
            <button
              (click)="onFeedback('positive')"
              [class]="
                message().feedback === 'positive'
                  ? 'p-2 text-green-600 bg-green-50 rounded-lg transition-colors'
                  : 'p-2 text-gray-400 hover:text-green-600 hover:bg-green-50 rounded-lg transition-colors'
              "
              title="Helpful"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path
                  d="M2 10.5a1.5 1.5 0 113 0v-6a1.5 1.5 0 01-3 0v6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z"
                />
              </svg>
            </button>

            <!-- Thumbs Down -->
            <button
              (click)="onFeedback('negative')"
              [class]="
                message().feedback === 'negative'
                  ? 'p-2 text-red-600 bg-red-50 rounded-lg transition-colors'
                  : 'p-2 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition-colors'
              "
              title="Not helpful"
            >
              <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                <path
                  d="M18 9.5a1.5 1.5 0 11-3 0v-6a1.5 1.5 0 013 0v6zM14 9.667v-5.43a2 2 0 00-1.106-1.79l-.05-.025A4 4 0 0011.057 2H5.641a2 2 0 00-1.962 1.608l-1.2 6A2 2 0 004.44 12H8v4a2 2 0 002 2 1 1 0 001-1v-.667a4 4 0 01.8-2.4l1.4-1.866a4 4 0 00.8-2.4z"
                />
              </svg>
            </button>
          </div>
        }
      </div>
    } @else {
      <div class="bg-blue-600 rounded-lg px-4 py-3">
        <p class="text-white text-sm leading-relaxed">{{ message().content }}</p>
      </div>
    }
  </div>
</div>
