<!-- Sidebar Header -->
<div class="bg-white border-b border-gray-200 p-4">
  <!-- Logo -->
  <h1 class="text-lg font-bold text-gray-900 mb-4">CHAT A.I+</h1>

  <!-- New Chat Button -->
  <button (click)="onNewChat()" class="w-full bg-blue-600 text-white rounded-full py-2 px-4 mb-3 flex items-center justify-center gap-2 hover:bg-blue-700 transition-colors">
    <span>+</span>
    <span>New chat</span>
  </button>

  <!-- Search Button -->
  <button class="w-full border border-gray-300 rounded-full py-2 px-4 flex items-center justify-center hover:bg-gray-50 transition-colors">
    <svg class="w-5 h-5 text-gray-600" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" />
    </svg>
  </button>
</div>

<!-- Conversations List -->
<div class="flex-1 overflow-y-auto">
  <!-- Current Conversations -->
  <div class="p-4">
    <div class="flex items-center justify-between mb-3">
      <h3 class="text-sm font-semibold text-gray-700">Your conversations</h3>
      <button (click)="onClearAll()" class="text-xs text-blue-600 hover:text-blue-700">Clear All</button>
    </div>

    @for (conv of conversations(); track conv.id) {
      <button (click)="onSelectConversation(conv)" class="group w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors mb-2 flex items-start justify-between">
        <div class="flex items-start gap-3 flex-1 min-w-0">
          <svg class="w-4 h-4 text-gray-400 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M2 5a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5z" />
          </svg>
          <span class="text-sm text-gray-700 truncate group-hover:text-gray-900">{{ conv.title }}</span>
        </div>
        <!-- Delete button on hover -->
        <button 
          (click)="onDeleteConversation($event, conv.id)" 
          class="ml-2 flex-shrink-0 p-1 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded opacity-0 group-hover:opacity-100 transition-all"
          title="Delete conversation"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
        </button>
      </button>
    }
  </div>

  <!-- Last 7 Days -->
  <div class="p-4 border-t border-gray-200">
    <h4 class="text-xs font-semibold text-gray-500 uppercase mb-3">Last 7 Days</h4>
    @for (conv of lastSevenDays(); track conv.id) {
      <button (click)="onSelectConversation(conv)" class="group w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors mb-2 flex items-start justify-between">
        <div class="flex items-start gap-3 flex-1 min-w-0">
          <svg class="w-4 h-4 text-gray-400 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M2 5a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5z" />
          </svg>
          <span class="text-sm text-gray-700 truncate group-hover:text-gray-900">{{ conv.title }}</span>
        </div>
        <button 
          (click)="onDeleteConversation($event, conv.id)" 
          class="ml-2 flex-shrink-0 p-1 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded opacity-0 group-hover:opacity-100 transition-all"
          title="Delete conversation"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
        </button>
      </button>
    }
  </div>

  <!-- Older -->
  <div class="p-4 border-t border-gray-200">
    <h4 class="text-xs font-semibold text-gray-500 uppercase mb-3">Older</h4>
    @for (conv of olderConversations(); track conv.id) {
      <button (click)="onSelectConversation(conv)" class="group w-full text-left px-3 py-2 rounded-lg hover:bg-gray-100 transition-colors mb-2 flex items-start justify-between">
        <div class="flex items-start gap-3 flex-1 min-w-0">
          <svg class="w-4 h-4 text-gray-400 flex-shrink-0 mt-0.5" fill="currentColor" viewBox="0 0 20 20">
            <path d="M2 5a2 2 0 012-2h12a2 2 0 012 2v10a2 2 0 01-2 2H4a2 2 0 01-2-2V5z" />
          </svg>
          <span class="text-sm text-gray-700 truncate group-hover:text-gray-900">{{ conv.title }}</span>
        </div>
        <button 
          (click)="onDeleteConversation($event, conv.id)" 
          class="ml-2 flex-shrink-0 p-1 text-gray-400 hover:text-red-600 hover:bg-red-50 rounded opacity-0 group-hover:opacity-100 transition-all"
          title="Delete conversation"
        >
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
          </svg>
        </button>
      </button>
    }
  </div>
</div>

<!-- Footer -->
<div class="border-t border-gray-200 p-4 space-y-2">
  <!-- Settings -->
  <button (click)="onSettings()" class="w-full flex items-center gap-3 px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors text-sm">
    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
    </svg>
    <span>Settings</span>
  </button>

  <!-- User Profile -->
  <button class="w-full flex items-center gap-3 px-3 py-2 text-gray-700 hover:bg-gray-100 rounded-lg transition-colors text-sm">
    <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Andrew" alt="Andrew Nelson" class="w-6 h-6 rounded-full">
    <span>Andrew Nelson</span>
  </button>
</div>
